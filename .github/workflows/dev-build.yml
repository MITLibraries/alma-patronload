name: Dev Image Build and Deploy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'

jobs:

  build-push:
    name: Dev Build and Push
    permissions:
      id-token: write
      contents: read
    uses: mitlibraries/.github/.github/workflows/ecr-multi-arch-deploy-dev.yml@main
    secrets: inherit
    with:
      AWS_REGION: us-east-1
      GHA_ROLE: alma-patronload-gha-dev
      ECR: alma-patronload-dev
      PREBUILD: "make dependencies"
